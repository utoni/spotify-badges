[package]
name = "spotify-badges"
version = "0.0.1"
edition = "2024"
description = "Spotify Badges - Generate spotify SVG web badges."
repository = "https://github.com/utoni/spotify-badges"
homepage = "https://www.impl.cc/spotify-badges/api/now-playing.svg"
license-file = "COPYING"

[dependencies]
base64 = "0.22"
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
rpath = false
incremental = false
